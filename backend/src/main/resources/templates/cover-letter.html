<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${meta.subject}">Anschreiben</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
  <style>
    /* DIN 5008, Form B: Ränder links 25 mm, rechts 20 mm; Anschriftfeld ab 45 mm von oben. */
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #2F2F28;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page { width: 210mm; min-height: 297mm; padding: 0 20mm 20mm 25mm; position: relative; }
    .sans { font-family: 'DM Sans', Arial, sans-serif; }

    .head-classic {
      height: 45mm; display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm;
      padding-bottom: 4mm; border-bottom: 1.5px solid #2F2F28;
    }
    .head-classic .name { font-size: 22pt; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
    .head-classic .contact { text-align: right; font-size: 8.5pt; line-height: 1.6; color: #55544C; }

    .head-modern {
      height: 45mm; margin: 0 -20mm 0 -25mm; padding: 0 20mm 6mm 25mm; background: #31A2AC; color: #fff;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm;
    }
    .head-modern .name { font-size: 21pt; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; }
    .head-modern .address { font-size: 9pt; margin-top: 1.5mm; opacity: .95; }
    .head-modern .contact { text-align: right; font-size: 8.5pt; line-height: 1.6; }

    .address-zone { height: 45mm; padding-top: 5mm; display: flex; justify-content: space-between; align-items: flex-end; }
    .sender-line {
      font-size: 7.5pt; color: #6B6A62; border-bottom: .5px solid #9A99A8; display: inline-block;
      padding-bottom: 1px; margin-bottom: 3mm;
    }
    .recipient span { display: block; }
    .date { white-space: nowrap; }

    .custom { margin-top: 3mm; font-size: 8.5pt; color: #55544C; display: flex; flex-wrap: wrap; gap: 1mm 4mm; }
    .custom b { font-weight: 600; }

    .subject { font-weight: 600; margin: 10mm 0 6mm; }
    p { margin: 0 0 3mm; orphans: 3; widows: 3; }
    .closing { margin-top: 6mm; margin-bottom: 12mm; }
  </style>
</head>
<body>
<div class="page">
  <div th:if="${modern}" class="head-modern sans">
    <div>
      <div class="name" th:text="${meta.senderName}">Name</div>
      <div class="address" th:text="${modernAddress}">Straße · Ort</div>
    </div>
    <div class="contact"><th:block th:each="c, s : ${contactLines}"><span th:text="${c}"></span><br th:unless="${s.last}"></th:block></div>
  </div>
  <div th:unless="${modern}" class="head-classic">
    <div class="name" th:text="${meta.senderName}">Name</div>
    <div class="contact sans"><th:block th:each="c, s : ${contactLines}"><span th:text="${c}"></span><br th:unless="${s.last}"></th:block></div>
  </div>

  <div class="address-zone">
    <div>
      <div class="sender-line sans" th:text="${meta.senderLine}">Absender</div>
      <div class="recipient"><span th:each="l : ${meta.recipientLines}" th:text="${l}"></span></div>
    </div>
    <div class="date" th:text="${meta.dateLine}">Ort, Datum</div>
  </div>
  <div class="custom sans" th:if="${!customFields.isEmpty()}">
    <span th:each="f : ${customFields}"><b th:text="${f.label() + ':'}"></b> <th:block th:text="${f.value()}"></th:block></span>
  </div>

  <div class="subject" th:text="${meta.subject}">Betreff</div>
  <p th:text="${meta.salutation}">Anrede</p>
  <p th:each="p : ${paragraphs}" th:text="${p}">Absatz</p>
  <p class="closing" th:text="${meta.closing}">Mit freundlichen Grüßen</p>
  <p th:text="${meta.senderName}">Name</p>
</div>
</body>
</html>
